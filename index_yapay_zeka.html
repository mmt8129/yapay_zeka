<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok & Tavily Local Test</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 10px; }
        .setup { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        input { width: calc(100% - 22px); padding: 10px; margin: 5px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        #chat { height: 300px; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; font-size: 14px; }
        .user { background: #007bff; align-self: flex-end; }
        .bot { background: #333; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="setup">
        <input type="text" id="grokKey" placeholder="Grok API Key (gsk_...)">
        <input type="text" id="tavilyKey" placeholder="Tavily API Key (tvly-...)">
        <button onclick="saveKeys()">ANAHTARLARI YERELDE SAKLA</button>
    </div>

    <div id="chat"></div>
    
    <div style="display:flex; margin-top:10px;">
        <input type="text" id="userInput" placeholder="Mesaj yazın..." style="flex:1;">
        <button onclick="send()" style="width:auto; margin-left:10px;">GÖNDER</button>
    </div>

    <script>
       const PROXY_URL = "https://autumn-dew-1884.06mmt8129.workers.dev/";
let chatHistory = []; // Konuşma buraya birikecek

        // Sayfa açıldığında anahtarları yükle
        window.onload = () => {
            document.getElementById('grokKey').value = localStorage.getItem('grok_key') || '';
            document.getElementById('tavilyKey').value = localStorage.getItem('tavily_key') || '';
        };

        function saveKeys() {
            localStorage.setItem('grok_key', document.getElementById('grokKey').value);
            localStorage.setItem('tavily_key', document.getElementById('tavilyKey').value);
            alert("ABİ Anahtarlar kaydedildi!");
        }

        function addMsg(s, t) {
            const d = document.createElement('div');
            d.className = `msg ${s}`; d.innerText = t;
            const c = document.getElementById('chat');
            c.appendChild(d); c.scrollTop = c.scrollHeight;
        }

  async function send() {
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if (!msg) return;

    addMsg('user', msg);
    input.value = '';
    addMsg('bot', 'Düşünüyorum...');
    const botMsgDiv = document.getElementById('chat').lastElementChild;

    try {
        // Hafızayı da içeren mesaj listesi
        let messagesForIntent = [
            ...chatHistory.slice(-4), 
            { role: "user", content: `Son soru için internet araması lazım mı? Sadece SEARCH veya CHAT yaz: ${msg}` }
        ];

        // Arama kararı
        const intentRes = await fetch(`${PROXY_URL}/?url=https://api.groq.com/openai/v1/chat/completions`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('grok_key')}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: messagesForIntent })
        });
        const intentData = await intentRes.json();
        
        let context = "";
        if (intentData.choices[0].message.content.includes("SEARCH")) {
            // Arama terimini hafızayla birleştiriyoruz
            const searchQuery = chatHistory.length > 0 ? chatHistory[chatHistory.length-2].content + " " + msg : msg;
            const sRes = await fetch(`${PROXY_URL}/?url=https://api.tavily.com/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ api_key: localStorage.getItem('tavily_key'), query: searchQuery, search_depth: "advanced" })
            });
            const sData = await sRes.json();
            context = "\nBilgi: " + sData.results.map(r => r.content).join(" ");
        }

        // Final Cevabı
        const finalMessages = [
            { role: "system", content: "Sen Galatasaraylı, samimi bir asistansın. Her cevaba ABİ diyerek başla. 🔹 kullan. Kısa ol." },
            ...chatHistory.slice(-6),
            { role: "user", content: context + "\n\nSoru: " + msg }
        ];

        const chatRes = await fetch(`${PROXY_URL}/?url=https://api.groq.com/openai/v1/chat/completions`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('grok_key')}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: finalMessages })
        });
        const chatData = await chatRes.json();
        const reply = chatData.choices[0].message.content;

        // Hafızaya ekle
        chatHistory.push({ role: "user", content: msg });
        chatHistory.push({ role: "assistant", content: reply });

        botMsgDiv.innerText = reply;
    } catch (e) {
        botMsgDiv.innerText = "ABİ hata oldu!";
    }
}
    </script>
</body>
</html>
