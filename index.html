<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khoj Smart Pro</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --user-bubble: #ff4b2b;
            --khoj-border: #ff4b2b;
            --accent: #ff4b2b;
            --font-size: 14px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; transition: background 0.3s; }
        
        .header { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; padding: 0 15px; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-btn { font-size: 30px; cursor: pointer; color: var(--accent); }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 300; backdrop-filter: blur(5px); }
        .sidebar { position: fixed; left: -60%; top: 0; width: 60%; height: 100%; background: rgba(10, 10, 10, 0.98); z-index: 301; transition: 0.4s ease; padding: 25px 15px; display: flex; flex-direction: column; border-right: 2px solid var(--accent); }
        .sidebar.active { left: 0; }
        
        .sidebar-section { border: 1.5px solid var(--accent); border-radius: 15px; padding: 12px; margin-bottom: 15px; cursor: pointer; text-align: center; font-weight: bold; color: var(--accent); font-size: 14px; }
        .chat-list-container { flex: 1; overflow-y: auto; margin-top: 5px; border: 1.5px solid var(--accent); border-radius: 15px; padding: 10px; background: rgba(0,0,0,0.2); }
        .chat-item { padding: 12px; border-radius: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.05); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; position: relative; }
        .chat-item.active { border-color: var(--accent); background: rgba(255, 75, 43, 0.15); }

        #chat-screen { height: 100%; overflow-y: auto; padding: 80px 15px 150px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { margin-bottom: 20px; padding: 15px 18px; border-radius: 20px; max-width: 85%; line-height: 1.6; font-size: var(--font-size); word-wrap: break-word; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
        .khoj-message { align-self: flex-start; background: transparent; border: 1.5px solid var(--khoj-border); color: var(--text-color); border-bottom-left-radius: 4px; }

        .input-wrapper { position: fixed; bottom: 0; width: 100%; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); z-index: 100; border-top: 1px solid rgba(255,255,255,0.1); }
        .input-container { display: flex; align-items: flex-end; gap: 10px; }
        #user-input { flex: 1; background: #fff; border: none; border-radius: 20px; padding: 12px 18px; color: #000; font-size: 16px; min-height: 45px; max-height: 150px; resize: none; }
        .send-btn { font-size: 35px; color: var(--accent); cursor: pointer; line-height: 1; }

        #thinking { display: none; text-align: center; color: var(--accent); font-size: 12px; padding: 10px; margin: 0 20px 15px; border: 1.5px solid var(--accent); border-radius: 15px; font-weight: bold; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 400; backdrop-filter: blur(10px); }
        .modal-box { background: #111; width: 90%; max-width: 360px; padding: 25px; border-radius: 25px; border: 1.5px solid #333; color: #fff; }
        .setting-item { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .btn-circle { width: 40px; height: 40px; border-radius: 50%; border: none; background: #333; color: white; font-size: 20px; cursor: pointer; }
        .btn { width: 100%; padding: 14px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-orange { background: var(--accent); color: white; }
        .btn-gray { background: #444; color: #ccc; }
        .btn-danger { background: #c0392b; color: white; }
        
        select, textarea { width: 100%; padding: 12px; border-radius: 12px; background: #222; border: 1px solid #444; color: #fff; font-family: inherit; }
    </style>
</head>
<body>

    <div class="header">
        <span class="menu-btn" onclick="openSidebar()">⋮</span>
        <span style="margin-left: 15px; font-weight: bold; letter-spacing: 1px;">KHOJ PRO</span>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-section" onclick="openSettings()">AYARLAR ⚙️</div>
        <div class="sidebar-section" onclick="createNewChat()">YENİ SOHBET ＋</div>
        <div style="font-size: 11px; color: #666; margin: 5px 5px 10px;">GEÇMİŞ SOHBETLER</div>
        <div id="chat-list" class="chat-list-container"></div>
        <button class="btn btn-danger" onclick="confirmExit()" style="margin-top: 15px;">ÇIKIŞ YAP 🚪</button>
    </div>

    <div id="chat-screen"></div>
    <div id="thinking">Khoj yazıyor... ⚡</div>

    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="user-input" rows="1" placeholder="Mesaj yaz..."></textarea>
            <div class="send-btn" onclick="handleSend()">➤</div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0">AYARLAR</h3>
            <div class="setting-item">
                <label>Sistem Talimatı</label>
                <textarea id="system-prompt" rows="2"></textarea>
            </div>
            <div class="setting-item">
                <label>Tema</label>
                <select id="theme-select" onchange="updateTheme(this.value)">
                    <option value="dark">Siyah Zemin / Beyaz Yazı</option>
                    <option value="white">Beyaz Zemin / Siyah Yazı</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Hız: <span id="speed-val">20</span> ms / Font: <span id="font-val">14</span> px</label>
                <div class="controls">
                    <button class="btn-circle" onclick="adjustConfig('font', -1)">A-</button>
                    <button class="btn-circle" onclick="adjustConfig('font', 1)">A+</button>
                    <button class="btn-circle" onclick="adjustConfig('speed', -5)">⚡-</button>
                    <button class="btn-circle" onclick="adjustConfig('speed', 5)">⚡+</button>
                </div>
            </div>
            <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" class="btn btn-orange" style="text-decoration:none; display:block; text-align:center;">CORS İZNİ AL 🔑</a>
            <button class="btn btn-danger" onclick="confirmClearAll()">TÜM SOHBETLERİ SİL</button>
            <button class="btn btn-gray" onclick="closeModals()">KAPAT</button>
        </div>
    </div>

    <div id="action-modal" class="modal-overlay">
        <div class="modal-box">
            <h4>Seçenekler</h4>
            <button class="btn btn-orange" onclick="renameChat()">Yeniden Adlandır ✏️</button>
            <button class="btn btn-danger" onclick="deleteSingleChat()">Sohbeti Sil 🗑️</button>
            <button class="btn btn-gray" onclick="closeModals()">Vazgeç</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://corsproxy.io/?https://app.khoj.dev/api/chat';
        const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';

        let chats = JSON.parse(localStorage.getItem('khoj_chats')) || {};
        let activeChatId = localStorage.getItem('khoj_active_id');
        let config = JSON.parse(localStorage.getItem('khoj_config')) || { speed: 20, font: 14, theme: 'dark', systemPrompt: '' };
        let pressTimer;

        window.onload = () => {
            if (!activeChatId || !chats[activeChatId]) {
                createNewChat();
            } else {
                applyConfig();
                renderChatList();
                loadActiveChat();
            }
        };

        function openSidebar() { document.getElementById('sidebar-overlay').style.display = 'block'; document.getElementById('sidebar').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar-overlay').style.display = 'none'; document.getElementById('sidebar').classList.remove('active'); }
        function openSettings() { closeSidebar(); document.getElementById('settings-modal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { title: "Yeni Sohbet", messages: [] };
            activeChatId = id;
            saveAll();
            renderChatList();
            loadActiveChat();
            closeSidebar();
        }

        function loadActiveChat() {
            const screen = document.getElementById('chat-screen');
            screen.innerHTML = '';
            if (chats[activeChatId]) {
                chats[activeChatId].messages.forEach(m => displayMessage(m.text, m.type, false));
            }
            screen.scrollTop = screen.scrollHeight;
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            Object.keys(chats).sort((a,b) => b.split('_')[1] - a.split('_')[1]).forEach(id => {
                const item = document.createElement('div');
                item.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
                item.innerText = chats[id].title;
                item.onclick = () => { activeChatId = id; saveAll(); loadActiveChat(); closeSidebar(); };
                
                item.ontouchstart = () => { pressTimer = setTimeout(() => { if(navigator.vibrate) navigator.vibrate(50); activeChatId = id; document.getElementById('action-modal').style.display='flex'; }, 800); };
                item.ontouchend = () => clearTimeout(pressTimer);
                item.onmousedown = () => { pressTimer = setTimeout(() => { activeChatId = id; document.getElementById('action-modal').style.display='flex'; }, 800); };
                item.onmouseup = () => clearTimeout(pressTimer);

                list.appendChild(item);
            });
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            displayMessage(text, 'user-message', false);
            chats[activeChatId].messages.push({text: text, type:'user-message'});
            
            if(chats[activeChatId].title === "Yeni Sohbet") {
                chats[activeChatId].title = text.substring(0,25);
            }

            input.value = '';
            input.style.height = '45px';
            document.getElementById('thinking').style.display = 'block';
            
            await fetchAI(text);
            saveAll();
            renderChatList();
        }

        async function fetchAI(query) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query, stream: false, n: 1, client: "web" })
                });
                const data = await response.json();
                document.getElementById('thinking').style.display = 'none';
                if(data.response) {
                    let clean = data.response.replace(/\*\*|\[.*?\]|\(https?:\/\/.*?\)/g, '').trim();
                    displayMessage(clean, 'khoj-message', true);
                    chats[activeChatId].messages.push({text: clean, type:'khoj-message'});
                }
            } catch(e) { 
                document.getElementById('thinking').style.display = 'none';
                displayMessage("Hata: CORS izni almanız gerekebilir!", 'khoj-message', false);
            }
        }

        function displayMessage(text, type, animate) {
            const screen = document.getElementById('chat-screen');
            const d = document.createElement('div');
            d.className = `message ${type}`;
            screen.appendChild(d);
            if(animate) {
                let i = 0; 
                function typeWriter() { 
                    if(i < text.length) { 
                        d.textContent += text.charAt(i++); 
                        screen.scrollTop = screen.scrollHeight; 
                        setTimeout(typeWriter, config.speed); 
                    } 
                }
                typeWriter();
            } else { 
                d.textContent = text; 
                screen.scrollTop = screen.scrollHeight; 
            }
        }

        function adjustConfig(type, val) {
            if(type === 'speed') config.speed = Math.max(0, config.speed + val);
            if(type === 'font') config.font = Math.max(10, config.font + val);
            applyConfig();
            saveAll();
        }

        function updateTheme(val) {
            config.theme = val;
            applyConfig();
            saveAll();
        }

        function applyConfig() {
            document.getElementById('speed-val').innerText = config.speed;
            document.getElementById('font-val').innerText = config.font;
            document.getElementById('system-prompt').value = config.systemPrompt || '';
            document.getElementById('theme-select').value = config.theme;
            document.documentElement.style.setProperty('--font-size', config.font + 'px');
            if(config.theme === 'white') {
                document.documentElement.style.setProperty('--bg-color', '#ffffff');
                document.documentElement.style.setProperty('--text-color', '#000000');
            } else {
                document.documentElement.style.setProperty('--bg-color', '#000000');
                document.documentElement.style.setProperty('--text-color', '#ffffff');
            }
        }

        function saveAll() {
            localStorage.setItem('khoj_chats', JSON.stringify(chats));
            localStorage.setItem('khoj_active_id', activeChatId);
            config.systemPrompt = document.getElementById('system-prompt').value;
            localStorage.setItem('khoj_config', JSON.stringify(config));
        }

        function deleteSingleChat() { if(confirm("Bu sohbet kalıcı olarak silinsin mi?")) { delete chats[activeChatId]; activeChatId = Object.keys(chats)[0] || null; if(!activeChatId) createNewChat(); saveAll(); loadActiveChat(); closeModals(); } }
        function renameChat() { const t = prompt("Yeni isim:", chats[activeChatId].title); if(t) { chats[activeChatId].title = t; saveAll(); renderChatList(); closeModals(); } }
        function confirmClearAll() { if(confirm("Tüm sohbet geçmişi silinecek! Onaylıyor musunuz?")) { localStorage.clear(); location.reload(); } }
        function confirmExit() { if(confirm("Uygulamadan çıkılsın mı?")) alert("Uygulamayı kapatmak için sekmenizi sonlandırın."); }

        document.getElementById('user-input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    </script>
</body>
    </html>
