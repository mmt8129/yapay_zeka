<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khoj Smart Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root { 
    /* KARANLIK TEMA: SİMSİYAH YERİNE KOYU FÜME/SİYAHIMSI */
    --bg-color: #121212; 
    --text-color: white; 
    --user-bubble: #ff4b2b; 
    --khoj-border: #ff4b2b; 
    --accent: #ff4b2b; 
    --font-size: 14px; 
    --panel-bg: rgba(0, 0, 0, 0.6); 
    --input-bg: #ffffff; 
    /* ARKA PLAN RESMİ BURAYA */
    --chat-bg-img: url('https://w0.peakpx.com/wallpaper/413/278/HD-wallpaper-manzara-dag.jpg');
}

[data-theme="white"] { 
    /* AYDINLIK TEMA RENKLERİ */
    --bg-color: #121212; 
    --text-color: black; 
    --panel-bg: rgba(255, 255, 255, 0.4); 
    --input-bg: #ffffff; 
    --khoj-border: #ff4b2b; 
    /* ABİ RESİM LİNKİNİ BURAYA YERLEŞTİRDİM */
    --chat-bg-img: url('https://i.pinimg.com/474x/6b/c4/7d/6bc47d41f79b81be286f3b841887e2e5.jpg');
}


        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; transition: background 0.3s, color 0.3s; }
        .menu-btn { position: fixed; top: 5px; left: 15px; font-size: 32px; cursor: pointer; color: white; z-index: 200; }
        .clock-panel { position: fixed; top: 5px; left: 50%; transform: translateX(-50%); background:transparent /*var(--panel-bg)*/; backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 20px; border: 1px solid var(--accent); z-index: 150; color: white/*var(--accent)*/; font-weight: 900; font-size: 16px; letter-spacing: 1px; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 300; backdrop-filter: blur(5px); }
    
        .sidebar { 
    position: fixed; 
    left: -75%; 
    top: 0; 
    width: 75%; 
    height: 100%; 
    background: transparent; /* Zemin rengini sabit siyah yaptık 🌑 */
    z-index: 301; 
    transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
    padding: 25px 15px; 
    border-right: 2px solid #ffffff; 
    color: #ffffff; /* Yazıları beyaz yaptık ⚪ */
}

        .sidebar.active { left: 0; }
        .sidebar-section { border: 1.2px solid #ffffff; border-radius: 15px; padding: 12px; margin-bottom: 15px; cursor: pointer; text-align: center; font-weight: 900; color: white !important /*var(--accent)*/ ; font-size: 14px; text-transform: uppercase; }
        .chat-list-container { height: calc(100% - 150px); overflow-y: auto; margin-top: 5px; border: 1.5px solid #ffffff; border-radius: 15px; padding: 10px; background: rgba(128,128,128,0.1); }
        .chat-item { position: relative; padding: 12px 12px 12px 25px; border-radius: 10px; margin-bottom: 8px; background: rgba(128,128,128,0.1); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; color: white !important /*var(--accent)*/ ; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .chat-item.active { border-color: #ffffff; background: rgba(255, 255, 255, 0.2); }
        .chat-item.active::before { content: ""; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
        #chat-screen { 
    height: 100%; 
    overflow-y: auto; 
    padding: 80px 15px 180px; 
    display: flex; 
    flex-direction: column; 
    /* ARKA PLAN AYARLARI */
    background-image: var(--chat-bg-img);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: var(--bg-color); /* Resim yüklenmezse tema rengi görünür */
}

        .message { margin-bottom: 20px; padding: 15px 18px; border-radius: 20px; max-width: 95%; line-height: 1.6; font-size: var(--font-size); font-weight: 700; word-wrap: break-word; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; margin-left: 5%; 
            background: rgba(255, 255, 255, 0.22); 
            border: 1.2px solid rgba(255, 75, 43, 0.9); /* Kenarlığı biraz incelttik daha zarif durur */
    /* BUĞU EFEKTİ */
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);}
        
    .khoj-message {
    align-self: flex-start;
    /* ABİ BURASI ÖNEMLİ: Kutunun altına hafif bir beyazlık/siyahlık katmanı ekledik ki blur belli olsun */
    background: rgba(255, 255, 255, 0.22); 
    /* BUĞU EFEKTİ */
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    
    border: 1.2px solid rgba(255, 75, 43, 0.9); /* Kenarlığı biraz incelttik daha zarif durur */
    color: #FF19C11; /* Portakal rengi yazın */
    border-bottom-left-radius: 4px;
    margin-right: 2%;
    margin-left: 8%;
    padding: 15px 18px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); /* Hafif gölge */
}

.input-wrapper {
    position: fixed; 
    bottom: 0; 
    width: 100%; 
    background: transparent; 
    border-top: none; 
    /* ABİ BURADAKİ 5px DEĞERİNİ 0 YAPARSAN TAM DİBE YAPIŞIR */
    align-items: flex-end;
    padding: 10px 15px 2px; 
    z-index: 100; 
}

        .input-container { display: flex; align-items: flex-end; gap: 10px; max-width: 800px; margin: 0 auto; }
        #user-input { 
    flex: 1; 
    background: rgba(255, 255, 255, 0.7); 
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border: 1px solid rgba(204, 204, 204, 0.5); 
    border-radius: 20px; 
    /* ABİ YÜKSEKLİĞİ VE İÇ BOŞLUĞU AZALTTIK */
    padding: 8px 12px; 
    color: #000; 
    font-size: 15px; 
    min-height: 38px; 
    max-height: 120px; 
    resize: none; 
    outline: none;
    line-height: 1.4;
}

.send-btn { 
    background: none; 
    border: none; 
    cursor: pointer; 
    /* ABİ BOYUTU KÜÇÜLTTÜK */
    width: 35px; 
    height: 40px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    margin-left: 5px; 
    margin-bottom: 5px
    padding: 0;
    /* TURUNCU RENK BURADA SABİT */
    color: #ff4b2b; 
    fill: #ff4b2b;
}

.send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 35px; /* Buton alanını hafif büyüttük */
    height: 35px;
    background: none;
    border: none;
    cursor: pointer;
    /* ABİ BUTONU YUKARI ÇEKEN SATIR BURASI */
    margin-bottom: 7px; 
    margin-left: 5px;
}

.send-btn svg {
    /* ABİ SİMGE BURADAN BÜYÜR (20px'di 24px yaptık) */
    width: 24px; 
    height: 24px;
    fill: #ff4b2b; /* Turuncu rengin */
}


.send-btn svg, 
.send-btn img {
    width: 100% !important; 
    height: 100% !important;
    transform: scale(1.5); /* ABİ BURADAKİ 1.5 DEĞERİNİ ARTIRARAK DEVASA YAPABİLİRSİN */
    display: block !important;
} 
        .retry-container { display: flex; justify-content: center; margin-top: 5px; }
        .retry-btn { font-size: 11px; font-weight: 900; color: var(--accent); cursor: pointer; background: rgba(128,128,128,0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--accent); text-transform: uppercase; }
        .typing-dots { display: none; gap: 8px; padding: 15px 18px; margin-left: 10%; margin-bottom: 20px; align-self: flex-start; }
        .dot { width: 12px; height: 12px; background-color: var(--accent); border-radius: 50%; opacity: 0; animation: dotFlow 3s infinite; }
        @keyframes dotFlow { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 400; backdrop-filter: blur(10px); }
        
    .modal-box { 
    background: transparent; /* rgba(0, 0, 0, 0.9); /* Buraya istediğin renk kodunu yaz abi */
    width: 92%; 
    max-width: 380px; 
    padding: 25px; 
    border-radius: 25px; 
    border: 1.2px solid var(--accent); 
    color: #ffffff /* var(--text-color)*/ ;
    max-height: 85vh; 
    overflow-y: auto; 
}

        .modern-controls { display: flex; background: rgba(128,128,128,0.1); border-radius: 15px; border: 1px solid #444; overflow: hidden; margin-top: 5px; }
        .btn-ctrl { flex: 1; padding: 15px; border: none; background: transparent; color: var(--text-color); font-size: 20px; font-weight: 900; cursor: pointer; }
        .ctrl-val { flex: 2; display: flex; align-items: center; justify-content: center; background: rgba(128,128,128,0.1); font-size: 14px; font-weight: 900; border-left: 1px solid #444; border-right: 1px solid #444; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 14px; text-transform: uppercase; }
        .btn-orange { background: var(--accent); color: white; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-gray { background: #666; color: white; }
        select, textarea { width: 100%; padding: 12px; border-radius: 12px; background: rgba(128,128,128,0.1); border: 1px solid #444; color: var(--text-color); font-family: inherit; margin-top: 5px; }
    </style>
</head>
<body data-theme="dark">
    <div class="menu-btn" onclick="openSidebar()">☰</div>
    <div class="clock-panel" id="live-clock">00:00</div>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-section" onclick="openSettings()">AYARLAR ⚙️</div>
        <div class="sidebar-section" onclick="createNewChat()">YENİ SOHBET +</div>
        <div id="chat-list" class="chat-list-container"></div>
    </div>
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color:var(--accent); text-align:center; font-weight: 900;">SOHBETİ DÜZENLE</h3>
            <div class="setting-item"><label style="font-size:11px; font-weight:900">YENİ İSİM</label><textarea id="edit-chat-name" rows="1"></textarea></div>
            <button class="btn btn-orange" onclick="saveChatName()">Yeniden Adlandır</button>
            <button class="btn btn-danger" onclick="deleteChat()">Sil 🗑️</button>
            <button class="btn btn-gray" onclick="closeModals()">Vazgeç</button>
        </div>
    </div>
    <div id="chat-screen"></div>
    <div id="thinking" class="typing-dots">
        <div class="dot" style="animation-delay: 0.0s"></div><div class="dot" style="animation-delay: 0.5s"></div>
        <div class="dot" style="animation-delay: 1.0s"></div><div class="dot" style="animation-delay: 1.5s"></div>
        <div class="dot" style="animation-delay: 2.0s"></div><div class="dot" style="animation-delay: 2.5s"></div>
    </div>
    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="user-input" rows="1" placeholder="Buraya yaz abi..."></textarea>
            <div class="send-btn" onclick="handleSend()">➤</div>
        </div>
        <div class="retry-container">  

        </div>
    </div>
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color:var(--accent); text-align:center; font-weight: 900;">AYARLAR</h3>
            <div class="setting-item"><label style="font-size:11px; font-weight:900">Hafıza İçin Buraya Bilgi Gir</label><textarea id="system-prompt" rows="2"></textarea></div>
            <div class="setting-item"><label style="font-size:11px; font-weight:900">TEMA SEÇİMİ</label><select id="theme-select" onchange="updateTheme(this.value)"><option value="dark">KARANLIK (SİYAH)</option><option value="white">AYDINLIK (BEYAZ)</option></select></div>
            <div class="setting-item">
                <label style="font-size:11px; font-weight:900">YAZI BOYUTU</label>
                <div class="modern-controls">
                    <button class="btn-ctrl" onclick="adjustConfig('font', -1)">-</button>
                    <div class="ctrl-val"><span id="font-val">14</span>PX</div>
                    <button class="btn-ctrl" onclick="adjustConfig('font', 1)">+</button>
                </div>
            </div>
            <div class="setting-item">
                <label style="font-size:11px; font-weight:900">CEVAP HIZI</label>
                <div class="modern-controls">
                    <button class="btn-ctrl" onclick="adjustConfig('speed', -5)">-</button>
                    <div class="ctrl-val"><span id="speed-val">20</span>MS</div>
                    <button class="btn-ctrl" onclick="adjustConfig('speed', 5)">+</button>
                </div>
            </div>
            <button class="btn btn-danger" onclick="confirmClearAll()">Tüm Sohbet ve Hafızayı Sil</button>
            <button class="btn btn-gray" onclick="closeModals()">KAPAT</button>
        </div>
    </div>
    <script>
        const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';
        const API_URL = "https://white-heart-ea96.06mmt8129.workers.dev/";
        let chats = JSON.parse(localStorage.getItem('khoj_chats')) || {};
        let activeChatId = localStorage.getItem('khoj_active_id');
        let config = JSON.parse(localStorage.getItem('khoj_config')) || { speed: 20, font: 14, theme: 'dark', systemPrompt: '' };
        let lastUserMsg = ""; 

        function updateClock() {
            const now = new Date();
            const clock = document.getElementById('live-clock');
            if(clock) clock.innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock();

        window.onload = () => {
            applyConfig();
            if (Object.keys(chats).length === 0 || !activeChatId || !chats[activeChatId]) { createNewChat(); } 
            else { renderChatList(); loadActiveChat(); }
        };

        const screen = document.getElementById('chat-screen');
        let isUserScrolling = false;
        screen.addEventListener('touchstart', () => { isUserScrolling = true; });
        screen.addEventListener('scroll', () => {
            if (screen.scrollTop + screen.clientHeight < screen.scrollHeight - 50) isUserScrolling = true;
            else isUserScrolling = false;
        });

        function openSidebar() { document.getElementById('sidebar-overlay').style.display = 'block'; document.getElementById('sidebar').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar-overlay').style.display = 'none'; document.getElementById('sidebar').classList.remove('active'); }
        function openSettings() { closeSidebar(); document.getElementById('settings-modal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); saveAll(); }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { title: "YENİ SOHBET", messages: [], sysSent: false };
            activeChatId = id;
            saveAll(); 
            location.reload();
        }

        function loadActiveChat() {
            if (!activeChatId || !chats[activeChatId]) return;
            screen.innerHTML = '';
            chats[activeChatId].messages.forEach(m => displayMessage(m.text, m.type, false));
            screen.scrollTop = screen.scrollHeight;
            isUserScrolling = false;
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            let text = input.value.trim();
            if(!text) return;
            lastUserMsg = text; // ABİ: Son mesajı hafızaya aldık
            await processMsg(text);
            input.value = ''; 
            input.style.height = '48px';
        }

        async function retryLastMessage() {
            if(!lastUserMsg) { alert("HENÜZ MESAJ ATMADIN ABİ"); return; }
            await processMsg(lastUserMsg);
        }

        async function processMsg(text) {
            if(!activeChatId || !chats[activeChatId]) return;
            const currentChatId = activeChatId;
            let finalMsg = text;
            if(config.systemPrompt && !chats[currentChatId].sysSent) {
                finalMsg = config.systemPrompt + "\n\n" + text;
                chats[currentChatId].sysSent = true;
            }
            displayMessage(text, 'user-message', false);
            chats[currentChatId].messages.push({text: text, type:'user-message'});
            if(chats[currentChatId].title === "YENİ SOHBET") chats[currentChatId].title = text.substring(0,25).toUpperCase();
            
            const thinking = document.getElementById('thinking');
            thinking.style.display = 'flex';
            screen.appendChild(thinking);
            screen.scrollTop = screen.scrollHeight;
            await fetchAI(finalMsg, currentChatId);
            saveAll();
        }

        async function fetchAI(query, chatId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query, stream: false, n: 1, client: "web" })
                });
                const data = await response.json();
                document.getElementById('thinking').style.display = 'none';
                if(data.response && chats[chatId]) {
                    let clean = data.response.replace(/\*\*|\[.*?\]|\(https?:\/\/.*?\)/g, '').trim();
                    chats[chatId].messages.push({text: clean, type:'khoj-message'});
                    if(chatId === activeChatId) displayMessage(clean, 'khoj-message', true);
                    saveAll();
                }
            } catch(e) { 
                document.getElementById('thinking').style.display = 'none';
                if(chatId === activeChatId) displayMessage("BAĞLANTI HATASI!", 'khoj-message', false);
            }
        }

        function displayMessage(text, type, animate) {
            const d = document.createElement('div');
            d.className = `message ${type}`;
            screen.appendChild(d);
            if(animate) {
                let i = 0; d.textContent = "";
                function typeWriter() { 
                    if(i < text.length) { 
                        d.textContent += text.charAt(i++); 
                        if(!isUserScrolling) screen.scrollTop = screen.scrollHeight;
                        setTimeout(typeWriter, config.speed); 
                    } 
                }
                typeWriter();
            } else { d.textContent = text; screen.scrollTop = screen.scrollHeight; }
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            if(!list) return;
            list.innerHTML = '';
            const sortedIds = Object.keys(chats).sort((a,b) => (parseInt(b.split('_')[1]) || 0) - (parseInt(a.split('_')[1]) || 0));
            sortedIds.forEach(id => {
                const item = document.createElement('div');
                item.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
                item.innerText = chats[id].title || "SOHBET";
                item.onclick = () => { if(activeChatId === id) { closeSidebar(); return; } activeChatId = id; saveAll(); location.reload(); };
                list.appendChild(item);
            });
        }

        function saveChatName() {
            const newName = document.getElementById('edit-chat-name').value.trim().toUpperCase();
            if(newName && chats[selectedChatId]) { chats[selectedChatId].title = newName; saveAll(); renderChatList(); closeModals(); }
        }

        function deleteChat() {
            if(Object.keys(chats).length <= 1) { alert("SON SOHBETİ SİLEMEZSİN"); return; }
            if(confirm("SİLİNSİN Mİ?")) { delete chats[selectedChatId]; if(activeChatId === selectedChatId) activeChatId = Object.keys(chats)[0]; saveAll(); location.reload(); }
        }

        function adjustConfig(type, val) {
            if(type === 'speed') config.speed = Math.max(0, config.speed + val);
            if(type === 'font') config.font = Math.max(10, config.font + val);
            applyConfig();
        }

        function updateTheme(val) { config.theme = val; applyConfig(); }

        function applyConfig() {
            const fVal = document.getElementById('font-val'), sVal = document.getElementById('speed-val');
            if(fVal) fVal.innerText = config.font; if(sVal) sVal.innerText = config.speed;
            const sp = document.getElementById('system-prompt'); if(sp) sp.value = config.systemPrompt || '';
            document.documentElement.style.setProperty('--font-size', config.font + 'px');
            document.body.setAttribute('data-theme', config.theme);
        }

        function saveAll() {
            const sp = document.getElementById('system-prompt'); if(sp) config.systemPrompt = sp.value;
            localStorage.setItem('khoj_chats', JSON.stringify(chats));
            localStorage.setItem('khoj_active_id', activeChatId);
            localStorage.setItem('khoj_config', JSON.stringify(config));
        }

        function confirmClearAll() { if(confirm("HER ŞEY SİLİNSİN Mİ?")) { localStorage.clear(); location.reload(); } }
        
        document.getElementById('user-input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    </script>
</body>
</html>
