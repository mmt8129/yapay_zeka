<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khoj Smart Pro</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --user-bubble: #ff4b2b;
            --khoj-bubble: rgba(200, 255, 200, 0.45);
            --font-size: 14px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; }
        
        .header { position: fixed; top: 0; width: 100%; height: 50px; display: flex; justify-content: flex-start; align-items: center; padding: 0 15px; z-index: 100; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .menu-btn { font-size: 28px; cursor: pointer; color: var(--text-color); }

        #chat-screen { height: calc(100% - 110px); overflow-y: auto; padding: 60px 15px 10px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        
        .message { margin-bottom: 20px; padding: 16px 20px; border-radius: 20px; max-width: 90%; line-height: 1.5; font-weight: 400; font-size: var(--font-size); word-wrap: break-word; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
        .khoj-message { align-self: flex-start; background: var(--khoj-bubble); color: var(--text-color); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

        .input-wrapper { position: fixed; bottom: 0; width: 100%; background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px env(safe-area-inset-bottom); }
        .input-container { display: flex; align-items: flex-end; gap: 8px; }
        #user-input { flex: 1; background: #fff; border: none; border-radius: 20px; padding: 10px 15px; color: black; font-size: 16px; font-weight: 400; outline: none; resize: none; min-height: 40px; max-height: 120px; }
        .send-btn { font-size: 32px; color: #ff4b2b; cursor: pointer; padding-bottom: 2px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(10px); }
        .modal-box { background: #1a1a1a; width: 90%; max-width: 380px; padding: 20px; border-radius: 25px; color: white; max-height: 90vh; overflow-y: auto; border: 1px solid #333; }
        .setting-item { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .btn-circle { width: 35px; height: 35px; border-radius: 50%; border: none; background: #333; color: white; font-size: 18px; cursor: pointer; }
        .btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; }
        .btn-save { background: #2ecc71; color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-cors { background: #f39c12; color: white; text-decoration: none; display: block; text-align: center; }
        .btn-close { background: #555; color: white; }

        #thinking { 
    display: none; /* Her zaman görünür olması için */
    text-align: center; 
    color: #ff4b2b; 
    font-size: 12px; 
    padding: 8px; 
    margin: 5px 15px;
    border: 1.5px solid #ff4b2b; /* Turuncu çerçeve */
    border-radius: 12px;
    font-weight: bold;
}

        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="header">
        <span class="menu-btn" onclick="toggleModal('settings-modal')">⋮</span>
    </div>
    <div id="chat-screen"></div>
    <div id="thinking">Khoj yazıyor... ⚡</div>
    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="user-input" rows="1" placeholder="Mesaj yaz..."></textarea>
            <div id="send-btn" class="send-btn">➤</div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0">AYARLAR</h3>
            <div class="setting-item">
                <label>Sistem Talimatı</label>
                <textarea id="system-prompt" style="width:100%; height:50px; border-radius:10px; padding:8px; background:#333; color:white; border:none;"></textarea>
            </div>
            <div class="setting-item">
                <label>Tema</label>
                <select id="theme-select" onchange="updateTheme(this.value)" style="padding:8px; border-radius:10px; background:#333; color:white; border:none;">
                    <option value="dark">Siyah Zemin / Beyaz Yazı</option>
                    <option value="white">Beyaz Zemin / Siyah Yazı</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Yazım Hızı (MS)</label>
                <div class="controls">
                    <button class="btn-circle" onclick="adjustValue('speed', -5)">-</button>
                    <span id="speed-val">30</span>
                    <button class="btn-circle" onclick="adjustValue('speed', 5)">+</button>
                </div>
            </div>
            <div class="setting-item">
                <label>Font Büyüklüğü</label>
                <div class="controls">
                    <button class="btn-circle" onclick="adjustValue('font', -1)">-</button>
                    <span id="font-val">14</span>
                    <button class="btn-circle" onclick="adjustValue('font', 1)">+</button>
                </div>
            </div>
            <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" class="btn btn-cors">CORS İZNİ AL (GEREKİRSE) 🔑</a>
            <button class="btn btn-save" onclick="startNewTopic()">YENİ KONU BAŞLAT ✅</button>
            <button class="btn btn-clear" onclick="clearChat()">SOHBETİ SİL 🗑️</button>
            <button class="btn btn-close" onclick="toggleModal('settings-modal')">KAPAT</button>
        </div>
    </div>

    <script>
        const chatScreen = document.getElementById('chat-screen');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const thinking = document.getElementById('thinking');
        const API_URL = 'https://cors-anywhere.herokuapp.com/https://app.khoj.dev/api/chat';
        const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';

        let settings = JSON.parse(localStorage.getItem('khoj_settings')) || { speed: 20, font: 14, theme: 'dark' };

        window.onload = () => {
            loadSettings();
            const history = JSON.parse(localStorage.getItem('khoj_history') || '[]');
            history.forEach(msg => addMessage(msg.text, msg.type, false));
        };

        function toggleModal(id) { document.getElementById(id).style.display = document.getElementById(id).style.display === 'flex' ? 'none' : 'flex'; }

        function loadSettings() {
            document.getElementById('system-prompt').value = localStorage.getItem('khoj_system_prompt') || '';
            document.getElementById('speed-val').innerText = settings.speed;
            document.getElementById('font-val').innerText = settings.font;
            document.getElementById('theme-select').value = settings.theme;
            updateTheme(settings.theme);
            document.documentElement.style.setProperty('--font-size', settings.font + 'px');
        }

        function adjustValue(type, change) {
            if(type === 'speed') settings.speed = Math.max(0, settings.speed + change);
            if(type === 'font') settings.font = Math.max(10, settings.font + change);
            localStorage.setItem('khoj_settings', JSON.stringify(settings));
            loadSettings();
        }

        function updateTheme(val) {
            settings.theme = val;
            if(val === 'dark') {
                document.documentElement.style.setProperty('--bg-color', '#000000');
                document.documentElement.style.setProperty('--text-color', '#ffffff');
            } else {
                document.documentElement.style.setProperty('--bg-color', '#ffffff');
                document.documentElement.style.setProperty('--text-color', '#000000');
            }
            localStorage.setItem('khoj_settings', JSON.stringify(settings));
        }

        function clearChat() { 
            chatScreen.innerHTML = ''; 
            localStorage.removeItem('khoj_history'); 
            toggleModal('settings-modal'); 
        }

        async function startNewTopic() {
            const prompt = document.getElementById('system-prompt').value;
            localStorage.setItem('khoj_system_prompt', prompt);
            chatScreen.innerHTML = '';
            localStorage.removeItem('khoj_history');
            toggleModal('settings-modal');
            if(prompt) {
                thinking.style.display = 'block';
                await fetchAPI(prompt, true);
                thinking.style.display = 'none';
            }
        }

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if(!text) return;
            addMessage(text, 'user-message', false);
            userInput.value = '';
            userInput.style.height = '40px';
            thinking.style.display = 'block';
            await fetchAPI(text);
        };

        async function fetchAPI(query, isHidden = false) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query, stream: false, n: 1, client: "web" })
                });
                const data = await response.json();
                thinking.style.display = 'none';
                if(data.response && !isHidden) {
                    // Linkleri ve parantezli kaynakları temizle
                    let cleanRes = data.response.replace(/\*\*|\[.*?\]|\(https?:\/\/.*?\)/g, '').trim();
                    addMessage(cleanRes, 'khoj-message', true);
                }
            } catch (e) {
                thinking.style.display = 'none';
                if(!isHidden) addMessage("ABİ bağlantı sorunu! CORS iznini kontrol et.", 'khoj-message', false);
            }
        }

        function addMessage(text, type, animate) {
            const d = document.createElement('div');
            d.className = 'message ' + type;
            chatScreen.appendChild(d);
            
            if(animate && type === 'khoj-message') {
                let i = 0;
                d.textContent = ""; 
                function typeWriter() {
                    if (i < text.length) {
                        d.textContent += text.charAt(i);
                        i++;
                        chatScreen.scrollTop = chatScreen.scrollHeight;
                        setTimeout(typeWriter, settings.speed);
                    } else {
                        saveHistory(text, type);
                    }
                }
                typeWriter();
            } else {
                d.textContent = text;
                chatScreen.scrollTop = chatScreen.scrollHeight;
                if(type === 'user-message') saveHistory(text, type);
            }
        }

        function saveHistory(text, type) {
            let history = JSON.parse(localStorage.getItem('khoj_history') || '[]');
            history.push({ text, type });
            localStorage.setItem('khoj_history', JSON.stringify(history));
        }

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
