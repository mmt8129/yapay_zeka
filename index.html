<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMT Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-color: #f0f4f8; 
            --text-color: #1a1a1a; 
            --user-bubble: #3b82f6; 
            --accent: #22c55e; 
            --font-size: 16px; 
            --font-weight: 900;
            --header-bg: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* ÜST BANNER */
        .top-banner { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: var(--header-bg); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; z-index: 1000; 
            border-bottom: 2px solid #e2e8f0;
        }
        .header-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 20px; }
        .header-left { display: flex; gap: 10px; align-items: center; }
        .header-right { display: flex; gap: 10px; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #22c55e; color: white; }
        .btn-gray { background: #64748b; color: white; }
        #live-clock { font-weight: 900; font-size: 18px; color: #1e293b; }

        /* CHAT EKRANI */
        #chat-screen { height: 100%; overflow-y: auto; padding: 80px 10px 140px; display: flex; flex-direction: column; background: #f8fafc; }

        /* MESAJLAR */
        .message { margin-bottom: 15px; padding: 12px 18px; font-size: var(--font-size); font-weight: var(--font-weight); word-wrap: break-word; line-height: 1.8; text-transform: uppercase; }
        .user-message { align-self: flex-end; background: var(--user-bubble); color: white; border-radius: 15px; max-width: 85%; border: none; }
        .khoj-message { align-self: flex-start; background: transparent; color: #1e293b; max-width: 98%; padding: 10px; }

        /* EFEKTLER */
        .effect-fade { animation: fadeIn 0.5s ease forwards; }
        .effect-slide { animation: slideUp 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* BEKLEME NOKTALARI (THINKING) */
        .typing-dots { display: none; gap: 5px; padding: 15px; align-self: flex-start; }
        .dot { width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; animation: dotAnim 1.4s infinite; }
        @keyframes dotAnim { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        /* ALT BANNER & INPUT */
        .input-wrapper { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; z-index: 1000; border-top: 2px solid #3b82f6; }
        .input-container { display: flex; align-items: center; gap: 10px; max-width: 800px; margin: 0 auto; }
        #user-input { flex: 1; background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 900; color: #1e293b; resize: none; }
        .send-btn { background: #22c55e; color: white; width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

        /* MODAL SİSTEMİ */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-box { background: white; width: 92%; max-width: 400px; border-radius: 20px; border: 3px solid #3b82f6; padding: 20px; max-height: 85vh; display: flex; flex-direction: column; }
        .modal-title { text-align: center; color: #3b82f6; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        
        /* GEÇMİŞ LİSTESİ */
        .chat-list-scroll { flex: 1; overflow-y: auto; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px; min-height: 300px; }
        .history-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; user-select: none; }
        .history-item.active { background: #eff6ff; border-left: 5px solid #3b82f6; }
        
        .setting-row { margin-bottom: 12px; }
        .ctrl-group { display: flex; border: 2px solid #3b82f6; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .btn-ctrl { flex: 1; padding: 8px; border: none; background: white; font-weight: 900; cursor: pointer; }
        .ctrl-val { flex: 2; display: flex; align-items: center; justify-content: center; background: #eff6ff; font-weight: 900; border-left: 2px solid #3b82f6; border-right: 2px solid #3b82f6; }

        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        select { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #3b82f6; font-weight: 900; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="top-banner">
        <div class="header-left"><div class="header-btn btn-gray" onclick="openSettings()">⚙️</div><div id="live-clock">00:00</div></div>
        <div class="header-right"><div class="header-btn btn-blue" onclick="openHistory()">🕒</div><div class="header-btn btn-green" onclick="askNewChat()">+</div></div>
    </div>

    <div id="chat-screen"></div>

    <div id="thinking" class="typing-dots">
        <div class="dot" style="animation-delay: 0s"></div><div class="dot" style="animation-delay: 0.2s"></div><div class="dot" style="animation-delay: 0.4s"></div>
        <div class="dot" style="animation-delay: 0.6s"></div><div class="dot" style="animation-delay: 0.8s"></div><div class="dot" style="animation-delay: 1s"></div>
    </div>

    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="user-input" rows="1" placeholder="BURAYA YAZ ABİ..."></textarea>
            <div class="send-btn" onclick="handleSend()">➤</div>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">GEÇMİŞ</h3>
            <div id="chat-list" class="chat-list-scroll"></div>
            <button class="btn btn-green" onclick="confirmSelectChat()">TAMAM</button>
            <button class="btn btn-gray" onclick="askClearAll()" style="background:#ef4444; color:white">TÜMÜNÜ SİL VE SIFIRLA</button>
            <button class="btn btn-gray" onclick="closeModals()">KAPAT</button>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box" style="text-align:center">
            <h3 class="modal-title" id="confirm-title">EMİN MİSİN?</h3>
            <p id="confirm-text" style="font-weight:900"></p>
            <div style="display:flex; gap:10px; margin-top:20px">
                <button class="btn btn-blue" id="confirm-yes">EVET</button>
                <button class="btn btn-gray" onclick="closeModals()" style="background:#ef4444; color:white">HAYIR</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">DÜZENLE</h3>
            <input type="text" id="edit-name-input" style="width:100%; padding:12px; border-radius:10px; border:2px solid #3b82f6; font-weight:900; margin-bottom:15px;">
            <button class="btn btn-blue" onclick="saveChatEdit()">GÜNCELLE</button>
            <button class="btn btn-gray" onclick="askDeleteSingle()" style="background:#ef4444; color:white">SİL</button>
            <button class="btn btn-gray" onclick="closeModals()">VAZGEÇ</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">AYARLAR</h3>
            <div class="setting-row">
                <label style="font-size:11px; font-weight:900">YAZI BOYUTU</label>
                <div class="ctrl-group">
                    <button class="btn-ctrl" onclick="adjustConfig('font', -1)">-</button>
                    <div class="ctrl-val"><span id="font-val">16</span>PX</div>
                    <button class="btn-ctrl" onclick="adjustConfig('font', 1)">+</button>
                </div>
            </div>
            <div class="setting-row">
                <label style="font-size:11px; font-weight:900">YAZI KALINLIĞI</label>
                <div class="ctrl-group">
                    <button class="btn-ctrl" onclick="adjustConfig('weight', -100)">-</button>
                    <div class="ctrl-val"><span id="weight-val">900</span></div>
                    <button class="btn-ctrl" onclick="adjustConfig('weight', 100)">+</button>
                </div>
            </div>
            <div class="setting-row">
                <label style="font-size:11px; font-weight:900">EFEKT SEÇİMİ</label>
                <select id="effect-select" onchange="adjustConfig('effect', this.value)">
                    <option value="typewriter">DAKTİLO</option>
                    <option value="fade">SOLARAK GELME</option>
                    <option value="slide">KAYARAK GELME</option>
                </select>
            </div>
            <div class="setting-row">
                <label style="font-size:11px; font-weight:900">CEVAP HIZI</label>
                <div class="ctrl-group">
                    <button class="btn-ctrl" onclick="adjustConfig('speed', -5)">-</button>
                    <div class="ctrl-val"><span id="speed-val">20</span>MS</div>
                    <button class="btn-ctrl" onclick="adjustConfig('speed', 5)">+</button>
                </div>
            </div>
            <button class="btn btn-blue" onclick="saveSettings()">KAYDET VE KAPAT</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqlA4yrw0rJZQyR3t6daJKru28EkmWhe4", authDomain: "khoj-smart.firebaseapp.com", databaseURL: "https://khoj-smart-default-rtdb.firebaseio.com/", projectId: "khoj-smart", storageBucket: "khoj-smart.firebasestorage.app", messagingSenderId: "603123756358", appId: "1:603123756358:web:16ec68ba2872ae0436c947" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';
        const API_URL = "https://white-heart-ea96.06mmt8129.workers.dev/";

        let chats = {}, activeChatId = null, selectedChatId = null, config = { speed: 20, font: 16, weight: 900, effect: 'typewriter', systemPrompt: '' };
        let pressTimer;

        function updateClock() { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}); }
        setInterval(updateClock, 1000); updateClock();

        window.onload = () => {
            database.ref().once('value', (s) => {
                const d = s.val();
                if (d) { 
                    chats = d.khoj_chats || {}; 
                    config = d.khoj_config || config; 
                    applyConfig();
                    activeChatId = localStorage.getItem('active_id') || Object.keys(chats)[0];
                    if (activeChatId && chats[activeChatId]) loadActiveChat(); else createNewChat();
                } else createNewChat();
            });
        };

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function openHistory() { renderChatList(); document.getElementById('history-modal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function askNewChat() { showConfirm("YENİ SOHBET", "Yeni bir sohbet başlatılsın mı?", createNewChat); }
        function askClearAll() { showConfirm("TEMİZLE", "Tüm geçmiş ve ayarlar silinsin mi?", () => { database.ref().remove().then(() => location.reload()); }); }
        function askDeleteSingle() { showConfirm("SİL", "Bu sohbeti silmek istediğine emin misin?", () => { delete chats[selectedChatId]; if(activeChatId === selectedChatId) activeChatId = Object.keys(chats)[0] || null; saveAll(); if(!activeChatId) createNewChat(); else loadActiveChat(); closeModals(); }); }

        function showConfirm(title, text, action) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-text').innerText = text;
            document.getElementById('confirm-yes').onclick = action;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = { title: "YENİ SOHBET", messages: [], date: new Date().toLocaleString('tr-TR') };
            activeChatId = id; saveAll(); loadActiveChat(); closeModals();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list'); list.innerHTML = '';
            Object.keys(chats).sort((a,b) => b.split('_')[1] - a.split('_')[1]).forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === selectedChatId ? 'active' : ''}`;
                item.innerHTML = `<div style="font-weight:900; font-size:14px; text-transform:uppercase;">${chats[id].title}</div><div style="font-size:11px; color:#64748b;">${chats[id].date}</div>`;
                item.onmousedown = () => { pressTimer = window.setTimeout(() => openEditModal(id), 1500); };
                item.onmouseup = () => { clearTimeout(pressTimer); };
                item.ontouchstart = () => { pressTimer = window.setTimeout(() => openEditModal(id), 1500); };
                item.ontouchend = () => { clearTimeout(pressTimer); };
                item.onclick = () => { selectedChatId = id; renderChatList(); };
                list.appendChild(item);
            });
        }

        function openEditModal(id) { selectedChatId = id; document.getElementById('edit-name-input').value = chats[id].title; document.getElementById('edit-modal').style.display = 'flex'; }
        function saveChatEdit() { chats[selectedChatId].title = document.getElementById('edit-name-input').value.toUpperCase(); saveAll(); renderChatList(); closeModals(); }
        function confirmSelectChat() { if (selectedChatId) { activeChatId = selectedChatId; loadActiveChat(); saveAll(); closeModals(); } }

        function loadActiveChat() {
            const s = document.getElementById('chat-screen'); s.innerHTML = '';
            chats[activeChatId].messages.forEach(m => displayMessage(m.text, m.type, false));
            s.scrollTop = s.scrollHeight;
        }

        async function handleSend() {
            const i = document.getElementById('user-input'), t = i.value.trim();
            if(!t || !activeChatId) return;
            i.value = ''; displayMessage(t, 'user-message', true);
            chats[activeChatId].messages.push({text: t, type:'user-message'});
            if(chats[activeChatId].title === "YENİ SOHBET") chats[activeChatId].title = t.substring(0,20).toUpperCase();
            document.getElementById('thinking').style.display = 'flex';
            try {
                const r = await fetch(API_URL, { method: 'POST', headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ q: t, stream: false }) });
                const d = await r.json();
                document.getElementById('thinking').style.display = 'none';
                if(d.response) {
                    let c = d.response.replace(/\*\*|\[.*?\]/g, '').trim();
                    chats[activeChatId].messages.push({text: c, type:'khoj-message'});
                    displayMessage(c, 'khoj-message', true); saveAll();
                }
            } catch(e) { document.getElementById('thinking').style.display = 'none'; }
        }

        function displayMessage(t, type, anim) {
            const s = document.getElementById('chat-screen'), d = document.createElement('div');
            d.className = `message ${type}`; s.appendChild(d);
            if(anim) {
                if(config.effect === 'typewriter') {
                    let idx = 0; d.textContent = "";
                    function tw() { if(idx < t.length) { d.textContent += t.charAt(idx++); s.scrollTop = s.scrollHeight; setTimeout(tw, config.speed); } } tw();
                } else {
                    d.textContent = t;
                    d.classList.add(config.effect === 'fade' ? 'effect-fade' : 'effect-slide');
                    s.scrollTop = s.scrollHeight;
                }
            } else { d.textContent = t; s.scrollTop = s.scrollHeight; }
        }

        function adjustConfig(type, val) {
            if(type === 'font') config.font = Math.max(12, config.font + val);
            if(type === 'weight') config.weight = Math.min(900, Math.max(100, config.weight + val));
            if(type === 'speed') config.speed = Math.max(0, config.speed + val);
            if(type === 'effect') config.effect = val;
            applyConfig();
        }

        function applyConfig() {
            document.getElementById('font-val').innerText = config.font;
            document.getElementById('weight-val').innerText = config.weight;
            document.getElementById('speed-val').innerText = config.speed;
            document.getElementById('effect-select').value = config.effect;
            document.documentElement.style.setProperty('--font-size', config.font + 'px');
            document.documentElement.style.setProperty('--font-weight', config.weight);
        }

        function saveSettings() { saveAll(); closeModals(); }
        function saveAll() { database.ref('khoj_chats').set(chats); database.ref('khoj_config').set(config); localStorage.setItem('active_id', activeChatId); }
    </script>
</body>
</html>
