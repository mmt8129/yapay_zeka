<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>KHOJ MS-DOS</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000000; color: #ffffff; 
            font-family: 'Lucida Console', 'Monaco', 'Consolas', monospace; 
            font-weight: bold; 
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden; 
        }
        #chat-screen { 
            height: calc(100% - 60px); overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; 
            box-sizing: border-box;
        }
        .message { 
            width: 100%; margin-bottom: 25px; 
            line-height: 1.4; font-size: 16px; 
            white-space: pre-wrap; font-weight: bold; color: #ffffff;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .user-message::before { content: "A:\\> "; color: #66FF66; }
        .khoj-message::before { content: "C:\\> "; color: gold; }
        
        .cors-error { color: #ff0000; cursor: pointer; text-decoration: underline; animation: blink 1s infinite; }
        
        .input-wrapper { 
            position: fixed; bottom: 0; width: 100%; 
            background: #000; padding: 10px; 
        }
        .input-container { display: flex; align-items: flex-start; position: relative; }
        .prompt-prefix { 
            color: #ffffff; margin-right: 0px; font-weight: bold; 
            width: 63px; flex-shrink: 0; cursor: pointer; user-select: none;
        }
        
        #user-input { 
            flex: 1; background: transparent; border: none; 
            color: #ffffff; font-family: 'Lucida Console', monospace; 
            font-size: 16px; font-weight: bold; outline: none; 
            padding: 0; margin: 0;
            caret-color: #ffffff;
            word-wrap: break-word; white-space: pre-wrap;
            resize: none; height: auto; min-height: 20px;
        }
        
        #thinking { color: #ffffff; padding-left: 20px; display: none; font-weight: bold; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="chat-screen"></div>
    <div id="thinking">Sistem işliyor...</div>
    <div class="input-wrapper">
        <div class="input-container" id="input-box">
            <span class="prompt-prefix" id="send-trigger">Abi:\></span>
            <textarea id="user-input" rows="1" autofocus autocomplete="off"></textarea>
        </div>
    </div>

    <script>
        // Service Worker Kaydı (PWA için zorunlu)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = "self.addEventListener('fetch', (e) => {});";
                const blob = new Blob([swCode], {type: 'text/javascript'});
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }

        const chatScreen = document.getElementById('chat-screen');
        const userInput = document.getElementById('user-input');
        const sendTrigger = document.getElementById('send-trigger');
        const thinking = document.getElementById('thinking');
        const API_URL = 'https://cors-anywhere.herokuapp.com/https://app.khoj.dev/api/chat';
        const apiKey = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';

        window.onload = () => {
            const savedChat = localStorage.getItem('khoj_chat_history');
            if (savedChat) {
                chatScreen.innerHTML = savedChat;
                chatScreen.scrollTop = chatScreen.scrollHeight;
            }
        };

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function processMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            if (text.toLowerCase() === 'cls') {
                chatScreen.innerHTML = '';
                localStorage.removeItem('khoj_chat_history');
                userInput.value = '';
                userInput.style.height = 'auto';
                userInput.blur();
                return;
            }

            addMessage(text, 'user-message');
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.blur();
            thinking.style.display = 'block';
            await fetchAPI(text);
        }

        sendTrigger.addEventListener('click', processMessage);

        async function fetchAPI(query) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query, stream: false, n: 1, client: "web" })
                });
                
                if (response.status === 403) throw new Error('CORS');

                const data = await response.json();
                thinking.style.display = 'none';
                addMessage(data.response || "Hata: Yanıt alınamadı.", 'khoj-message');
            } catch (e) {
                thinking.style.display = 'none';
                const errorMsg = e.message === 'CORS' 
                    ? "SİSTEM KİLİTLİ: BURAYA TIKLA VE CORS ONAYI VER!" 
                    : "Bağlantı hatası!";
                addMessage(errorMsg, 'khoj-message error-msg', e.message === 'CORS');
            }
        }

        function addMessage(text, type, isCors = false) {
            const d = document.createElement('div');
            d.className = 'message ' + type;
            
            if (isCors) {
                d.innerHTML = `<span class="cors-error" onclick="window.open('https://cors-anywhere.herokuapp.com/corsdemo', '_blank')">${text}</span>`;
            } else {
                d.innerText = text;
            }
            
            chatScreen.appendChild(d);
            chatScreen.scrollTop = chatScreen.scrollHeight;
            localStorage.setItem('khoj_chat_history', chatScreen.innerHTML);
        }
    </script>
</body>
</html>
