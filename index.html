	<script>
    
	setInterval(updateClock, 1000); updateClock();
const firebaseConfig = {
    apiKey: "AIzaSyBqlA4yrw0rJZQyR3t6daJKru28EkmWhe4",
    authDomain: "khoj-smart.firebaseapp.com",
    databaseURL: "https://khoj-smart-default-rtdb.firebaseio.com/",
    projectId: "khoj-smart",
    storageBucket: "khoj-smart.firebasestorage.app",
    messagingSenderId: "603123756358",
    appId: "1:603123756358:web:16ec68ba2872ae0436c947"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';
const API_URL = "https://white-heart-ea96.06mmt8129.workers.dev/";

let chats = JSON.parse(localStorage.getItem('khoj_chats')) || {};
let activeChatId = localStorage.getItem('khoj_active_id');
let config = JSON.parse(localStorage.getItem('khoj_config')) || { speed: 20, font: 14, theme: 'dark', systemPrompt: '' };

function updateClock() {
    const now = new Date();
    const clock = document.getElementById('live-clock');
    if(clock) clock.innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
}

function syncToFirebase() {
    if (database) {
        database.ref('khoj_chats').set(chats);
        database.ref('khoj_config').set(config);
    }
}

window.onload = () => {
    updateClock(); 
    setInterval(updateClock, 1000);
    applyConfig();

    if (database) {
        database.ref().once('value', (snapshot) => {
            const allData = snapshot.val();
            if (allData) {
                if (allData.khoj_chats) chats = allData.khoj_chats;
                if (allData.khoj_config) {
                    config = allData.khoj_config;
                    applyConfig();
                }
                renderChatList();
                if (!activeChatId || !chats[activeChatId]) {
                    activeChatId = Object.keys(chats)[0] || null;
                }
                if (activeChatId) loadActiveChat();
                else createNewChat();
            } else {
                createNewChat();
            }
        });
    }
};

const screen = document.getElementById('chat-screen');
let isUserScrolling = false;

function openSidebar() { document.getElementById('sidebar-overlay').style.display = 'block'; document.getElementById('sidebar').classList.add('active'); }
function closeSidebar() { document.getElementById('sidebar-overlay').style.display = 'none'; document.getElementById('sidebar').classList.remove('active'); }
function openSettings() { closeSidebar(); document.getElementById('settings-modal').style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); saveAll(); }

function createNewChat() {
    const id = 'chat_' + Date.now();
    chats[id] = { title: "YENİ SOHBET", messages: [], sysSent: false };
    activeChatId = id;
    saveAll();
    renderChatList();
    loadActiveChat();
}

function loadActiveChat() {
    if (!activeChatId || !chats[activeChatId]) return;
    screen.innerHTML = '';
    chats[activeChatId].messages.forEach(m => displayMessage(m.text, m.type, false));
    screen.scrollTop = screen.scrollHeight;
}

async function handleSend() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if(!text || !activeChatId) return;

    input.value = '';
    input.style.height = '48px';

    displayMessage(text, 'user-message', false);
    chats[activeChatId].messages.push({text: text, type:'user-message'});
    
    if(chats[activeChatId].title === "YENİ SOHBET") {
        chats[activeChatId].title = text.substring(0,20).toUpperCase();
        renderChatList();
    }

    const thinking = document.getElementById('thinking');
    thinking.style.display = 'flex';
    screen.appendChild(thinking);
    screen.scrollTop = screen.scrollHeight;

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ q: text, stream: false, client: "web" })
        });
        const data = await response.json();
        thinking.style.display = 'none';

        if(data.response) {
            let clean = data.response.replace(/\*\*|\[.*?\]|\(https?:\/\/.*?\)/g, '').trim();
            chats[activeChatId].messages.push({text: clean, type:'khoj-message'});
            displayMessage(clean, 'khoj-message', true);
            saveAll();
        }
    } catch(e) {
        thinking.style.display = 'none';
        displayMessage("BAĞLANTI HATASI!", 'khoj-message', false);
    }
}

function displayMessage(text, type, animate) {
    const d = document.createElement('div');
    d.className = `message ${type}`;
    screen.appendChild(d);
    if(animate) {
        let i = 0; d.textContent = "";
        function typeWriter() { 
            if(i < text.length) { 
                d.textContent += text.charAt(i++); 
                screen.scrollTop = screen.scrollHeight;
                setTimeout(typeWriter, config.speed); 
            } 
        }
        typeWriter();
    } else { d.textContent = text; screen.scrollTop = screen.scrollHeight; }
}

function renderChatList() {
    const list = document.getElementById('chat-list');
    if(!list) return;
    list.innerHTML = '';
    Object.keys(chats).sort((a,b) => b.split('_')[1] - a.split('_')[1]).forEach(id => {
        const item = document.createElement('div');
        item.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
        item.innerText = chats[id].title;
        item.onclick = () => { activeChatId = id; saveAll(); loadActiveChat(); closeSidebar(); };
        list.appendChild(item);
    });
}

function applyConfig() {
    document.getElementById('font-val').innerText = config.font;
    document.getElementById('speed-val').innerText = config.speed;
    document.getElementById('system-prompt').value = config.systemPrompt || '';
    document.documentElement.style.setProperty('--font-size', config.font + 'px');
    document.body.setAttribute('data-theme', config.theme);
}

function saveAll() {
    localStorage.setItem('khoj_chats', JSON.stringify(chats));
    localStorage.setItem('khoj_active_id', activeChatId);
    localStorage.setItem('khoj_config', JSON.stringify(config));
    syncToFirebase();
}

function adjustConfig(type, val) {
    if(type === 'speed') config.speed = Math.max(0, config.speed + val);
    if(type === 'font') config.font = Math.max(10, config.font + val);
    applyConfig();
    saveAll();
}

function confirmClearAll() { 
    if(confirm("HER ŞEY SİLİNSİN Mİ?")) { 
        localStorage.clear(); 
        database.ref().remove().then(() => location.reload());
    } 
}

document.getElementById('user-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});
    </script>
