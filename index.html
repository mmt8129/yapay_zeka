<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="data:application/manifest+json,{'name':'Khoj DOS','short_name':'Khoj','start_url':'.','display':'standalone','background_color':'#000000','theme_color':'#000000'}">
    <title>KHOJ MS-DOS</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000000; color: #ffffff; 
            font-family: 'Lucida Console', 'Monaco', 'Consolas', monospace; 
            font-weight: bold; 
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden; 
        }
        #chat-screen { 
            height: calc(100% - 60px); overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; 
            box-sizing: border-box;
        }
        .message { 
            width: 100%; margin-bottom: 25px; 
            line-height: 1.4; font-size: 16px; 
            white-space: pre-wrap; font-weight: bold; color: #ffffff;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .user-message::before { content: "A:\\> "; color: #66FF66; }
        .khoj-message::before { content: "C:\\> "; color: gold; }
        
        .input-wrapper { 
            position: fixed; bottom: 0; width: 100%; 
            background: #000; padding: 10px; 
        }
        .input-container { display: flex; align-items: flex-start; position: relative; }
        .prompt-prefix { 
            color: #ffffff; margin-right: 0px; font-weight: bold; 
            width: 63px; flex-shrink: 0; cursor: pointer; user-select: none;
        }
        
        #user-input { 
            flex: 1; background: transparent; border: none; 
            color: #ffffff; font-family: 'Lucida Console', monospace; 
            font-size: 16px; font-weight: bold; outline: none; 
            padding: 0; margin: 0;
            caret-color: #ffffff;
            word-wrap: break-word; white-space: pre-wrap;
            resize: none; height: auto; min-height: 20px;
        }
        
        #thinking { color: #ffffff; padding-left: 20px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat-screen"></div>
    <div id="thinking">Sistem işliyor...</div>
    <div class="input-wrapper">
        <div class="input-container" id="input-box">
            <span class="prompt-prefix" id="send-trigger">Abi:\></span>
            <textarea id="user-input" rows="1" autofocus autocomplete="off"></textarea>
        </div>
    </div>

    <script>
        // PWA Kaydı
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('fetch', function(event) {});";
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        }

        const chatScreen = document.getElementById('chat-screen');
        const userInput = document.getElementById('user-input');
        const sendTrigger = document.getElementById('send-trigger');
        const thinking = document.getElementById('thinking');
        const API_URL = 'https://cors-anywhere.herokuapp.com/https://app.khoj.dev/api/chat';
        const apiKey = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function processMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            if (text.toLowerCase() === 'cls') {
                chatScreen.innerHTML = '';
                userInput.value = '';
                userInput.style.height = 'auto';
                userInput.blur();
                return;
            }

            addMessage(text, 'user-message');
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.blur();
            thinking.style.display = 'block';
            await fetchAPI(text);
        }

        sendTrigger.addEventListener('click', processMessage);

        async function fetchAPI(query) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query, stream: false, n: 1, client: "web" })
                });
                const data = await response.json();
                thinking.style.display = 'none';
                addMessage(data.response || "Hata: Yanıt alınamadı.", 'khoj-message');
            } catch (e) {
                thinking.style.display = 'none';
                addMessage("Bağlantı hatası!", 'khoj-message');
            }
        }

        function addMessage(text, type) {
            const d = document.createElement('div');
            d.className = 'message ' + type;
            d.innerText = text;
            chatScreen.appendChild(d);
            chatScreen.scrollTop = chatScreen.scrollHeight;
        }
    </script>
</body>
</html>
