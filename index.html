<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMT Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-color: #f0f4f8; --text-color: #1a1a1a; --user-bubble: #3b82f6; 
            --header-bg: #ffffff; --input-bg: #ffffff; --msg-text: #1e293b;
            --font-size: 16px; --font-weight: 900;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a; --text-color: #f8fafc; --user-bubble: #2563eb;
            --header-bg: #1e293b; --input-bg: #1e293b; --msg-text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; transition: background 0.3s; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); overflow: hidden; }

        .top-banner { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: var(--header-bg); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; z-index: 1000; 
            border-bottom: 2px solid #33415555;
        }

        .header-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 20px; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #22c55e; color: white; }
        .btn-gray { background: #64748b; color: white; }
        #live-clock { font-weight: 900; font-size: 18px; }

        #chat-screen { height: 100%; overflow-y: auto; padding: 75px 10px 110px; display: flex; flex-direction: column; }

        .message { margin-bottom: 12px; padding: 12px 15px; font-size: var(--font-size); font-weight: var(--font-weight); word-wrap: break-word; line-height: 1.5; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background: var(--user-bubble); color: white; border-radius: 15px; max-width: 85%; }
        .khoj-message { align-self: flex-start; background: transparent; color: var(--msg-text); max-width: 98%; padding: 5px; }

        .input-wrapper { position: fixed; bottom: 0; width: 100%; background: var(--input-bg); padding: 8px 12px; z-index: 1000; border-top: 4px solid #3b82f6; }
        #progress-line {
            position: absolute; top: -4px; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to right, transparent, #ef4444, #3b82f6, #ef4444, transparent);
            background-size: 200% 100%; display: none; animation: moveLine 1.2s linear infinite;
        }
        @keyframes moveLine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .input-container { display: flex; align-items: center; gap: 8px; }
        #user-input { flex: 1; background: #33415522; border: 2px solid #cbd5e1; border-radius: 12px; padding: 10px; font-size: 16px; font-weight: 900; color: var(--text-color); resize: none; min-height: 44px; }
        .send-btn { background: #22c55e; color: white; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-box { background: var(--header-bg); width: 92%; max-width: 400px; border-radius: 20px; border: 3px solid #3b82f6; padding: 20px; color: var(--text-color); }
        .modal-title { text-align: center; color: #3b82f6; font-weight: 900; margin-bottom: 15px; }
        
        .setting-row { margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #3b82f6; font-weight: 900; background: var(--input-bg); color: var(--text-color); }
        
        .chat-list-scroll { flex: 1; overflow-y: auto; max-height: 300px; margin-bottom: 15px; border: 1px solid #33415555; }
        .history-item { padding: 15px; border-bottom: 1px solid #33415522; }
    </style>
</head>
<body data-theme="light">

    <div class="top-banner">
        <div class="header-left"><div class="header-btn btn-gray" onclick="openSettings()">⚙️</div><div id="live-clock">00:00</div></div>
        <div class="header-right"><div class="header-btn btn-blue" onclick="openHistory()">🕒</div><div class="header-btn btn-green" onclick="askNewChat()">+</div></div>
    </div>

    <div id="chat-screen"></div>

    <div class="input-wrapper">
        <div id="progress-line"></div>
        <div class="input-container">
            <textarea id="user-input" rows="1" placeholder="BURAYA YAZ ABİ..."></textarea>
            <div class="send-btn" onclick="handleSend()">➤</div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">AYARLAR</h3>
            <div class="setting-row">
                <label style="font-size:12px; font-weight:900">TEMA SEÇİMİ</label>
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="light">☀️ GÜNDÜZ MODU</option>
                    <option value="dark">🌙 GECE MODU</option>
                </select>
            </div>
            <div class="setting-row">
                <label style="font-size:12px; font-weight:900">YAZI BOYUTU</label>
                <select onchange="config.font=this.value; applyConfig()">
                    <option value="14">KÜÇÜK</option>
                    <option value="16" selected>NORMAL</option>
                    <option value="18">BÜYÜK</option>
                    <option value="20">ÇOK BÜYÜK</option>
                </select>
            </div>
            <button class="btn btn-blue" onclick="saveSettings()">KAYDET VE KAPAT</button>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">GEÇMİŞ</h3>
            <div id="chat-list" class="chat-list-scroll"></div>
            <button class="btn btn-blue" onclick="closeModals()">KAPAT</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqlA4yrw0rJZQyR3t6daJKru28EkmWhe4", authDomain: "khoj-smart.firebaseapp.com", databaseURL: "https://khoj-smart-default-rtdb.firebaseio.com/", projectId: "khoj-smart", storageBucket: "khoj-smart.firebasestorage.app", messagingSenderId: "603123756358", appId: "1:603123756358:web:16ec68ba2872ae0436c947" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const API_KEY = 'kk-ZeYLGGpxj0XScjEsTpgo4Aj2VjgJwtMJodqoyEsYtUI';
        const API_URL = "https://white-heart-ea96.06mmt8129.workers.dev/";

        let chats = {}, activeChatId = null, config = { theme: 'light', font: 16, weight: 900 };

        function updateClock() { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}); }
        setInterval(updateClock, 1000); updateClock();

        window.onload = () => {
            database.ref().once('value', (s) => {
                const d = s.val();
                if (d) { 
                    chats = d.khoj_chats || {}; 
                    config = d.khoj_config || config; 
                    changeTheme(config.theme);
                    applyConfig();
                    activeChatId = localStorage.getItem('active_id') || Object.keys(chats)[0];
                    if (activeChatId && chats[activeChatId]) loadActiveChat(); else createNewChat();
                } else createNewChat();
            });
        };

        function changeTheme(val) { config.theme = val; document.body.setAttribute('data-theme', val); saveAll(); }
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function openHistory() { renderChatList(); document.getElementById('history-modal').style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        async function handleSend() {
            const i = document.getElementById('user-input'), t = i.value.trim();
            if(!t || !activeChatId) return;
            i.value = ''; 
            displayMessage(t, 'user-message');
            chats[activeChatId].messages.push({text: t, type:'user-message'});
            
            document.getElementById('progress-line').style.display = 'block';

            try {
                const r = await fetch(API_URL, { method: 'POST', headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ q: t, stream: false }) });
                const d = await r.json();
                document.getElementById('progress-line').style.display = 'none';
                if(d.response) {
                    let cleaned = d.response
                        .replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').replace(/(?:https?|ftp):\/\/[\n\S]+/g, '') 
                        .replace(/^\s*\*\s+/gm, '🔹 ')
                        .replace(/\*\*(.*?)\*\*/g, '<span style="color:#ef4444;">$1</span>')
                        .trim();
                        
                    chats[activeChatId].messages.push({text: cleaned, type:'khoj-message'});
                    displayMessage(cleaned, 'khoj-message'); 
                    saveAll();
                }
            } catch(e) { document.getElementById('progress-line').style.display = 'none'; }
        }

        function displayMessage(t, type) {
            const s = document.getElementById('chat-screen'), d = document.createElement('div');
            d.className = `message ${type}`; d.innerHTML = t; s.appendChild(d);
            s.scrollTop = s.scrollHeight;
        }

        function applyConfig() {
            document.documentElement.style.setProperty('--font-size', config.font + 'px');
            document.documentElement.style.setProperty('--font-weight', config.weight);
        }

        function saveSettings() { saveAll(); closeModals(); }
        function saveAll() { database.ref('khoj_chats').set(chats); database.ref('khoj_config').set(config); localStorage.setItem('active_id', activeChatId); }
        // Diğer fonksiyonlar (renderChatList, askNewChat vs.) öncekiyle aynıdır.
    </script>
</body>
    </html>
